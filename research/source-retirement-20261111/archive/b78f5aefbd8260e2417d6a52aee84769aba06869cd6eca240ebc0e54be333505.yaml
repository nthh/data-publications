      or ODbL-1.0 per LakeATLAS_Catalog_v10.pdf; see the bundled field catalog for column-specific notices.
  spatial:
    extent: Global; exact per-layer extent is pinned in the source/build manifests.
    crs: EPSG:4326 (WGS 84 geographic)
    geometry: Lake polygon footprints and separate pour-point locations.
  temporal:
    extent: Static publication; observation years/periods vary by attribute.
    resolution: Variable by source attribute; consult the producer field catalog.
  field_units: Retained in the bundled LakeATLAS catalog PDF and schema inventory.
  nulls: Source nulls are preserved without imputation; full per-field null counts are reported.
  uncertainty: Source-specific uncertainty and provenance are described in the producer catalog; no harmonized
    uncertainty field is inferred.
  multiplicity: Keep every record in each native layer. Polygon and pour-point layers are separate assets
    and share native Hylak_id values by design.
