  use_case: The summary retains historical segment-level aggregate statistics. Its inspected geometry
    contains erroneous connectors and is withheld from publication; use the raw record for detailed per-observation
    geometry and original DBF fields.
  comparison: The summary product has 42,077 generalized records and segment-level statistics, unlike
    the raw component's many tiled source records and per-record widths. Nine-tile comparison confirmed
    straight summary connectors absent from raw vectors at source rows 11839, 13164, 15394, 15397, and
    15450. Those findings establish known sampled discrepancies, not a global accuracy result. The raw
    conversion does not invent summary statistics such as width_mean.
  spatial_coverage: 'Global: 829 raw tiles and 64,572,998 source records converted and independently compared.'
  temporal_coverage: Static Landsat-derived producer release V01.01; underlying observation dates vary.
  resolution: Individual source observations nominally represent approximately 30 m Landsat-derived river-width
    segments; this description does not assert uniform positional accuracy.
  formats:
