    limitations:
    - All 64,572,998 source records passed exact source comparison and a byte-identical clean rebuild.
      Global PMTiles and local package validation are in progress; the product is not yet prepared or
      published.
    - Raw observations are separate source records and short parts, not a connected river centerline network.
      Records are never joined by segmentID or segmentInd.
    - width_m value 1 is an unknown-width sentinel; width_valid indicates usable width without altering
      width_m.
    - The planned PMTiles is a zoom 8–12 display derivative with quantized geometry. The GeoParquet is
      the analytical source of record.
    - The release excludes masks, tile index, and RSSA basin supplement.
    - No GEE parity, global independent scientific-accuracy assessment, current-condition claim, or producer-operation
      reconstruction is made.
    supplements: []
    title: Global River Width from Landsat — raw vector observations V01.01
    summary: 'Proposed product: source-record-preserving GeoParquet conversion of the producer GRWL V01.01
      tiled vector observations, with a separately versioned zoom 8–12 detail PMTiles for display. Each
      observation retains its source tile, ordinal, all ten original DBF values, multipart geometry structure,
      and XY float64 coordinates. The raw product has a different scientific scope from the related simplified
      summary record and does not include its segment-level aggregate statistics. The complete global
      analytical source comparison and clean rebuild have passed. Display and package validation remain
      in progress; this product has not been created.'
    license_note: 'Producer license: CC BY 4.0. Preserve producer attribution and cite Allen and Pavelsky
      (2018), DOI 10.1126/science.aat0636. No public product has been created or uploaded.'
    attribution: Allen and Pavelsky (2018), Global extent of rivers and streams, Science 361(6402), 585–588,
      DOI 10.1126/science.aat0636; source product GRWL_vector_V01.01.
    temporal_note: Static producer release derived from Landsat observations with varying source dates;
      not current river conditions or a time series.
