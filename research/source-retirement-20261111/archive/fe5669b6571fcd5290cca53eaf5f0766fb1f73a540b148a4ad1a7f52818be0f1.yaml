  numeric_preservation: Preserve all DBF numeric values as exact Decimal-derived or integer values, retaining
    blanks and all-asterisk values as null. Do not coerce source numbers through binary floating point.
  geometry_preservation: Preserve source record multiplicity, tile identity, original 1-based record ordinal,
    part boundaries, part/vertex order, and every source XY float64 bit pattern. Convert each source PolyLine
    record directly to WKB MultiLineString; never join records by segmentID or segmentInd.
  width_semantics: Preserve width_m value 1 as the producer unknown-width sentinel. Add width_valid separately;
    do not replace sentinel values with estimates or means.
  citation: Allen, G.H. and Pavelsky, T.M. (2018), Global extent of rivers and streams. Science 361(6402),
    585–588. https://doi.org/10.1126/science.aat0636
  temporal_scope: Static producer release derived from Landsat observations; source observation dates
    vary. This is not a current river-width observation or a time series.
