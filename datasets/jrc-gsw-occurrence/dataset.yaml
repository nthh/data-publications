- id: opera-dswx-s1
  title: OPERA DSWx-S1 v1
  relationship: complement
  url: https://podaac.jpl.nasa.gov/dataset/OPERA_L3_DSWX-S1_V1
  use_case: Recent open-water mapping under cloud cover and at night using Sentinel-1 radar.
  spatial_coverage: Near-global land coverage, excluding Antarctica
  resolution: 30 m
  temporal_coverage: Forward production began September 2024 and is ongoing; the catalog includes earlier
    dates. Coverage for a particular region and date remains to be qualified.
  formats:
  - COG
  access: NASA PO.DAAC distribution; no file-level access or conformance checks performed in this comparison.
  comparison: The producer targets open inland water bodies greater than 3 hectares and 200 m in width.
    It is a recent radar extent product, not JRC historical occurrence; OPERA products are not harmonized
    across sensors. Use reprocessed replacements for the documented 2025 processing anomaly.
  reviewed_on: '2026-10-31'
  evidence:
  - title: NASA PO.DAAC product documentation and reprocessing notice
    url: https://podaac.jpl.nasa.gov/dataset/OPERA_L3_DSWX-S1_V1
  - title: JPL DSWx suite and sensor differences
    url: https://www.jpl.nasa.gov/go/opera/products/dswx-product-suite/
  - title: NASA DSWx fact sheet and COG format
    url: https://www.earthdata.nasa.gov/s3fs-public/2024-04/OPERA-DSWx_Fact_Sheet.pdf
- id: dynamic-world
  title: Dynamic World v1
  relationship: complement
  url: https://developers.google.com/earth-engine/datasets/catalog/GOOGLE_DYNAMICWORLD_V1
  use_case: Recent water and flooded-vegetation context alongside other land-cover classes.
  spatial_coverage: Global Sentinel-2 observation coverage
  resolution: 10 m
  temporal_coverage: June 2015 onward; near-real-time image-level predictions
  access: Official Earth Engine image collection. Independent bulk hosting and anonymous cloud-native
    asset access were not qualified here.
  comparison: The water band is a model class probability, not an observed multi-decade water-occurrence
    percentage. Cloud masking, probability thresholds and temporal aggregation must be specified before
    deriving a water product.
  reviewed_on: '2026-10-31'
  evidence:
  - title: Official Dynamic World catalog and terms
    url: https://developers.google.com/earth-engine/datasets/catalog/GOOGLE_DYNAMICWORLD_V1
- id: copernicus-water-bodies-100m
  title: Copernicus Water Bodies 100 m monthly v1
  relationship: complement
  url: https://land.copernicus.eu/en/products/water-bodies/water-bodies-global-v1-0-100m
  use_case: Regular global monthly inland-water monitoring at coarser resolution.
  spatial_coverage: Global
  resolution: 100 m
  temporal_coverage: 2020 onward; monthly composites
  formats:
  - COG (CDSE catalog listing)
  access: Copernicus Data Space Ecosystem lists a COG collection; individual objects, current completeness
    and access requirements were not tested here.
  comparison: Coarser than JRC and uses JRC maximum water extent in its masking, so it is not an independent
    reference for validating JRC. Its monthly detections and occurrence categories differ from the JRC
    long-term occurrence statistic.
  reviewed_on: '2026-10-31'
  evidence:
