    product_id: grwl
    title: Global River Width from Landsat — summary network V01.02
    summary: Historical simplified GRWL summary mirror, retained for comparison and withheld from publication
      because raw-source checks confirm artificial connecting edges. The separate grwl-raw product has
      complete analytical and display packages prepared from original observations.
    tags:
    - hydrology
    - rivers
    - global
    - geoparquet
    - pmtiles
    license_note: CC BY 4.0. Retain Allen and Pavelsky attribution and the source data and paper citations.
    attribution: Allen and Pavelsky; Global River Width from Landsat.
    temporal_note: Static Landsat-derived research product. The conversion date is not the observation
      date; no single observation interval is asserted.
    limitations:
    - The scope is the simplified summary network only; raw vectors, raster masks, tile indexes and RSSA
      basin products are excluded.
    - The selected producer filename is V01.02 while its record metadata and GEE counterpart name V01.01.
      Exact source DOI, filename and checksums identify this release.
    - PMTiles geometry is a display derivative; use GeoParquet for analysis.
    - Raw-vector and water-mask inspection confirms geometry errors in source-summary rows 11839, 13164,
      15394, 15397 and 15450. Straight connectors of 6.2 to 110.1 km join observations at tile exit/re-entry
      locations while the raw river follows a curved path. The prepared GeoParquet and PMTiles preserve
      these source errors. The five examples are not an exhaustive error inventory.
    - Source row28938 crosses the dateline. Use display/display-v1/assets/grwl.pmtiles for maps; original
      release-bundled PMTiles are retained as historical evidence and contain a world-spanning rendering
      artifact. Analytical GeoParquet preserves the original longitude discontinuity.
    supplements: []
